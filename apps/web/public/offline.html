<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Sem conexão · Kolo Família</title>
    <style>
      :root {
        font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      }
      body {
        margin: 0;
        min-height: 100dvh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #fafaf9;
        color: #1c1917;
        padding: 2rem;
      }
      .card {
        max-width: 420px;
        text-align: center;
      }
      h1 {
        font-size: 1.5rem;
        margin: 0 0 0.5rem;
      }
      p {
        color: #57534e;
        font-size: 0.95rem;
        line-height: 1.5;
      }
      button {
        margin-top: 1rem;
        padding: 0.6rem 1.2rem;
        font-size: 0.95rem;
        background: #0f172a;
        color: #fff;
        border: 0;
        border-radius: 6px;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <h1>Sem conexão</h1>
      <p>
        O Kolo Família precisa estar online pra abrir essa página. Quando a
        conexão voltar, ele recarrega automaticamente.
      </p>
      <button onclick="location.reload()">Tentar de novo</button>
    </div>
  </body>
</html>
